# Example boot entries for the Classical theme. Adapt before installing.
# Replace YOUR-ROOT-UUID, kernel/initramfs paths and EFI paths for your system.
# boot(): refers to the volume containing Limine; see CONFIG.md for other paths.
# Keep your existing working entries when applying only the graphical theme.
timeout: no
default_entry: 1
interface_resolution: 1280x720

/Linux
    comment: Start your Linux environment.
    protocol: linux
    path: boot():/vmlinuz-linux
    module_path: boot():/initramfs-linux.img
    cmdline: root=UUID=YOUR-ROOT-UUID rw quiet

/Windows
    comment: Continue to Windows.
    protocol: efi
    path: boot():/EFI/Microsoft/Boot/bootmgfw.efi

/Recovery
    comment: Restore and repair your system.
    protocol: linux
    path: boot():/vmlinuz-linux
    module_path: boot():/initramfs-linux-fallback.img
    cmdline: root=UUID=YOUR-ROOT-UUID rw single

/Tools
    comment: Utilities for maintenance and diagnostics.
    //UEFI Shell
        comment: Firmware tools and diagnostics.
        protocol: efi
        path: boot():/EFI/tools/shellx64.efi
