# Classical example theme. Boot entries and behaviour come from limine.conf.
# All geometry in u scales from a 1920x1080 canvas; px stays at physical size.
version: 1
enabled: yes
theme: /boot/eucleia.eui
title: EUCLEIA

[menu]
x: 218u
y: 438u
width: 656u
height: 392u
anchor: top-left

[menu.item]
height: 72u
gap: 8u
icon_x: 60u
icon_size: 40u
indicator_x: 608u
indicator_size: 24u

[menu.item.label]
x: 142u
baseline: 46u
width: 432u
font_size: 30u
letter_spacing: 0px
colour: #d8cdbd
align: left

[menu.item.selected]
fill_colour: #ad8058
fill_opacity: 0.09
border_colour: #c89a70
border_width: 2u
text_colour: #fff0dc
glow_colour: #d5995c
glow_width: 12u
glow_opacity: 0.24
marker: diamond-left
marker_size: 16u
marker_colour: #f2c392

[heading]
