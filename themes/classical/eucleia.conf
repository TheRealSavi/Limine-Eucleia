fill_colour: #332c22
fill_opacity: 0.6
border_colour: #8c7154
border_width: 1px
corner_radius: 4u
padding: 12u
gap: 12u

[details]
x: 218u
y: 844u
width: 656u
height: 92u
font_size: 22u
colour: #c8b8a1
letter_spacing: 0px
