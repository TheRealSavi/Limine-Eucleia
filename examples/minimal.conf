# A different composition using the same asset pack and boot entries.
version: 1
theme: /boot/eucleia.eui
title: CHOOSE YOUR SYSTEM

[background]
visible: no
colour: #101820

[menu]
x: 92%
y: 50%
anchor: right-center
width: 48%
height: 48%
padding: 16px

[menu.item]
height: 64px
gap: 12px
icon_size: 32px
icon_x: 16px
indicator_size: 20px
fill_colour: #172631
fill_opacity: 1
corner_radius: 8px

[menu.item.label]
x: 64px
baseline: 42px
font_size: 26px
letter_spacing: 0px
colour: #d5e4ea
align: left

[menu.item.selected]
fill_colour: #284b5e
fill_opacity: 1
border_colour: #72c8e7
border_width: 2px
corner_radius: 8px
text_colour: #ffffff

[heading]
x: 44%
y: 20%
width: 48%
font_size: 30px
letter_spacing: 2px
align: left
colour: #a9d7e7

[divider]
visible: no

[details]
x: 44%
y: 82%
width: 48%

[countdown]
x: 44%
y: 86%
width: 48%

[hints]
x: 44%
y: 92%
width: 48%
font_size: 14px
letter_spacing: 0px
align: left
colour: #91a9b5
