# Isolated QEMU demonstration of the Classical theme.
# The names demonstrate icon assignments. Every payload is the bundled test
# kernel; these entries do not boot installed operating systems or host disks.
timeout: no
default_entry: 1
interface_resolution: 1280x720
wallpaper: boot():/boot/bg.jpg
wallpaper_style: stretched
verbose: yes

/Linux
    comment: Start your Linux environment.
    protocol: limine
    path: boot():/boot/test.elf
    cmdline: eucleia-demo-linux

/Windows
    comment: Continue to Windows.
    protocol: limine
    path: boot():/boot/test.elf
    cmdline: eucleia-demo-windows

/Recovery
    comment: Restore and repair your system.
    protocol: limine
    path: boot():/boot/test.elf
    cmdline: eucleia-demo-recovery

/Tools
    comment: Utilities for maintenance and diagnostics.
    //UEFI Shell
        comment: Firmware tools and diagnostics.
        protocol: limine
        path: boot():/boot/test.elf
        cmdline: eucleia-demo-shell
    //Reload Limine
        comment: Reload the boot menu inside this virtual machine.
        protocol: efi
        path: boot():/EFI/BOOT/BOOTX64.EFI
