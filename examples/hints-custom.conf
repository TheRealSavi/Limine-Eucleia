# Key help and a selected-entry description card. Presentation only.
version: 1
theme: /boot/eucleia.eui
title: CHOOSE YOUR SYSTEM

[background]
visible: no
colour: #101820

[heading]
x: 6%
y: 18%
width: 88%
font_size: 36u
letter_spacing: 2px
align: left
colour: #d5e4ea

[menu]
x: 6%
y: 28%
width: 48%
height: 44%
padding: 12u

[menu.item]
height: 72u
gap: 12u
icon_x: 16u
icon_size: 32u
indicator_size: 20u
fill_colour: #172631
fill_opacity: 1
corner_radius: 8u

[menu.item.label]
x: 64u
baseline: 46u
font_size: 30u
letter_spacing: 0px
colour: #d5e4ea

[menu.item.selected]
fill_colour: #284b5e
fill_opacity: 1
border_colour: #72c8e7
border_width: 2u
corner_radius: 8u
text_colour: #ffffff
marker: diamond-right
marker_size: 14u

[divider]
visible: no

[details]
relative_to: selection
x: 50%
y: 0px
width: 33%
height: 150u
padding: 18u
font_size: 26u
letter_spacing: 0px
colour: #bed9e5
fill_colour: #172631
fill_opacity: 1
border_colour: #355e71
border_width: 1px
corner_radius: 8u
overflow: wrap
line_gap: 6u

[countdown]
x: 6%
y: 76%
width: 88%

[hints]
layout: custom
x: 6%
y: 80%
width: 88%
height: 16%
item_height: 48u
gap: 14u
padding: 12u
font_size: 24u
letter_spacing: 0px
align: left
colour: #92afbc
order: enter, select, edit, blank, firmware, shell
fill_colour: #15222c
fill_opacity: 0
corner_radius: 0px

[hints.key]
width: 0px
padding: 8u
gap: 14u
colour: #d8f4ff
fill_colour: #284b5e
fill_opacity: 1
border_colour: #4d8199
border_width: 1px
corner_radius: 5u

[hints.edit]
label: Edit options

[hints.blank]
label: New entry

[hints.enter]
x: 0%
y: 0px
width: 30%

[hints.select]
x: 35%
y: 30u
width: 30%

[hints.edit]
x: 70%
y: 0px
width: 30%

[hints.blank]
x: 0%
y: 64u
width: 30%

[hints.firmware]
x: 70%
y: 64u
width: 30%

[hints.shell]
visible: no
