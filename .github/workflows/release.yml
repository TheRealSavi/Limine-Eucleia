name: Prepare Eucleia release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman --noconfirm -Syu && pacman --needed --noconfirm -S base-devel git autoconf automake nasm mtools llvm clang lld python python-pillow python-fonttools
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Allow checkout ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Bootstrap pinned dependencies
        run: ./bootstrap
      - name: Configure all firmware targets
        run: mkdir build && cd build && ../configure --enable-werror --enable-all
      - name: Host regression checks
        run: bash tests/ui/gui-host.sh
      - name: Package source and binaries
        run: make -C build dist && make -C build -j$(nproc) dist-binary
      - name: Verify package contents
        run: python3 tests/packaging_test.py build/limine-eucleia-*.tar.gz
      - name: Upload candidate archives
        uses: actions/upload-artifact@v7
        with:
          name: limine-eucleia-candidate
          if-no-files-found: error
          path: |
            build/limine-eucleia-*.tar.gz
            build/limine-eucleia-*.tar.gz.sha256
