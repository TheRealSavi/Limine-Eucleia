name: Check the pull request target

on: [ pull_request ]

permissions:
  contents: read

jobs:
  pr_branch_check:
    name: Check the default branch
    runs-on: ubuntu-latest
    steps:
      - name: Require the repository's default branch
        if: ${{ github.base_ref != github.event.repository.default_branch }}
        run: |
          set -e
          echo "Please target this repository's default branch."
          false
